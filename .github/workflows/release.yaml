name: Build and release signage AAR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ARM and universal AARs
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake git gperf libtool make nasm ninja-build \
            pkg-config python3 python3-jinja2 python3-venv unzip wget zip

      - name: Install Python build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            "meson>=1.11.0,<2" "Jinja2>=3.1,<4" "jsonschema>=4,<5"
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/meson-venv/bin/meson" --version
          "$RUNNER_TEMP/meson-venv/bin/python" -c \
            'import jinja2, jsonschema; print("Python build modules OK")'

      - name: Use the runner Android SDK
        run: |
          mkdir -p buildscripts/sdk
          ln -sfn "$ANDROID_HOME" buildscripts/sdk/android-sdk-linux

      - name: Download SDK components and native sources
        working-directory: buildscripts
        env:
          IN_CI: 1
        run: ./download.sh

      - name: Build all supported ABIs
        run: ./build-signage.sh --arch all --skip-download

      - name: Save universal AAR
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp libmpv/build/outputs/aar/libmpv-release.aar \
            "dist/libmpv-android-signage-${version}-universal.aar"

      - name: Create ARM-only AAR
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          universal_aar="dist/libmpv-android-signage-${version}-universal.aar"
          arm_aar="dist/libmpv-android-signage-${version}-arm.aar"
          cp "$universal_aar" "$arm_aar"
          zip -q -d "$arm_aar" 'jni/x86/*' 'jni/x86_64/*'

      - name: Verify AAR ABI contents
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          arm_aar="dist/libmpv-android-signage-${version}-arm.aar"
          universal_aar="dist/libmpv-android-signage-${version}-universal.aar"

          for abi in armeabi-v7a arm64-v8a; do
            unzip -Z1 "$arm_aar" | grep -Fx "jni/${abi}/libplayer.so" >/dev/null
          done
          if unzip -Z1 "$arm_aar" | grep -E '^jni/(x86|x86_64)/' >/dev/null; then
            echo "ARM AAR unexpectedly contains an x86 ABI" >&2
            exit 1
          fi

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -Z1 "$universal_aar" | grep -Fx "jni/${abi}/libplayer.so" >/dev/null
          done
          echo "ARM and universal AAR ABI contents verified."

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cp buildscripts/include/depinfo.sh dist/dependency-versions.txt
          {
            printf 'tag=%s\n' "$GITHUB_REF_NAME"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'arm_abis=armeabi-v7a,arm64-v8a\n'
            printf 'universal_abis=armeabi-v7a,arm64-v8a,x86,x86_64\n'
            printf 'min_sdk=26\n'
          } > dist/build-info.txt
          cd dist
          sha256sum *.aar > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-android-signage-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.aar
            dist/SHA256SUMS
            dist/build-info.txt
            dist/dependency-versions.txt
