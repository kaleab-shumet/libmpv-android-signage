name: Build and release signage AAR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ARM AAR and create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake git gperf libtool make nasm ninja-build \
            pkg-config python3 python3-jinja2 python3-venv unzip wget

      - name: Install Python build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            "meson>=1.11.0,<2" "Jinja2>=3.1,<4" "jsonschema>=4,<5"
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/meson-venv/bin/meson" --version
          "$RUNNER_TEMP/meson-venv/bin/python" -c \
            'import jinja2, jsonschema; print("Python build modules OK")'

      - name: Use the runner Android SDK
        run: |
          mkdir -p buildscripts/sdk
          ln -sfn "$ANDROID_HOME" buildscripts/sdk/android-sdk-linux

      - name: Download SDK components and native sources
        working-directory: buildscripts
        env:
          IN_CI: 1
        run: ./download.sh

      - name: Build both ARM ABIs
        run: ./build-signage.sh --arch arm --skip-download

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp libmpv/build/outputs/aar/libmpv-release.aar \
            "dist/libmpv-android-signage-${version}.aar"
          cp buildscripts/include/depinfo.sh dist/dependency-versions.txt
          {
            printf 'tag=%s\n' "$GITHUB_REF_NAME"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'abis=armeabi-v7a,arm64-v8a\n'
            printf 'min_sdk=26\n'
          } > dist/build-info.txt
          cd dist
          sha256sum *.aar > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: libmpv-android-signage-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.aar
            dist/SHA256SUMS
            dist/build-info.txt
            dist/dependency-versions.txt
